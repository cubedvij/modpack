name: Aggregate Modpacks

on:
  push:
    branches-ignore:
      - main
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches
        run: git fetch --all

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .mrpack files
        run: python scripts/build_mrpacks.py .

      - name: Run aggregation script
        run: python scripts/aggregate_modpacks.py modpacks.json index.html

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release if it doesn't exist yet
          gh release create meta --title "Modpack Metadata" --notes "Auto-updated modpack index and .mrpack builds" 2>/dev/null || true
          # Upload/overwrite all assets
          gh release upload meta modpacks.json index.html *.mrpack --clobber

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages

  deploy-pages:
    needs: aggregate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
